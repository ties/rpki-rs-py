[package]
name = "rpki-rs"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rpki_rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.41"
num-bigint = "0.4.6"
pyo3 = { version = "0.28.3", features = ["chrono", "num-bigint"]  }
rpki = { version = "0.19.2", features = ["repository"] }
